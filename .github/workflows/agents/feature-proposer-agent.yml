name: Feature Proposer Agent
on:
  schedule:
    - cron: '5 17 * * *'  # Daily at 1:05 PM Caracas (UTC-4)
  workflow_dispatch:
    inputs:
      area:
        description: 'Area to analyze (ui, playback, lyrics, network, all)'
        required: false
        default: 'all'

permissions:
  contents: read
  issues: write

jobs:
  propose-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Analyze and propose features
        id: propose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 💡 Feature Proposer Agent Report" > feature_report.md
          echo "" >> feature_report.md
          echo "**Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> feature_report.md
          echo "" >> feature_report.md
          
          # Get existing issues to avoid duplicates
          EXISTING_ISSUES=$(gh issue list --state open --limit 100 --json title,body 2>/dev/null || echo "[]")
          
          # Analyze TODOs and FIXMEs as feature hints
          echo "### 📝 Analyzing Code Comments for Feature Ideas" >> feature_report.md
          echo "" >> feature_report.md
          
          TODOS=$(grep -rn "TODO\|FIXME\|XXX" app/src/main/java --include="*.kt" | grep -v "test" | head -30 || true)
          
          declare -a PROPOSED_FEATURES=()
          
          # Parse TODOs for feature ideas
          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            
            FILE=$(echo "$line" | cut -d: -f1)
            LINE_NUM=$(echo "$line" | cut -d: -f2)
            COMMENT=$(echo "$line" | cut -d: -f3- | sed 's/.*TODO:\?\|.*FIXME:\?//' | xargs)
            
            if [ -n "$COMMENT" ] && [ ${#COMMENT} -gt 5 ]; then
              PROPOSED_FEATURES+=("**$FILE:$LINE_NUM** - $COMMENT")
            fi
          done <<< "$TODOS"
          
          if [ ${#PROPOSED_FEATURES[@]} -gt 0 ]; then
            echo "Found ${#PROPOSED_FEATURES[@]} potential features from TODOs:" >> feature_report.md
            for feature in "${PROPOSED_FEATURES[@]:0:10}"; do
              echo "- $feature" >> feature_report.md
            done
          fi
          
          # Analyze user-facing features
          echo "" >> feature_report.md
          echo "### 🎯 Proposed New Features" >> feature_report.md
          echo "" >> feature_report.md
          
          # Check for UI features
          echo "#### 📱 UI/UX Improvements" >> feature_report.md
          
          # Check for settings that could be added
          SETTINGS=$(grep -rn "Settings\|Preferences" app/src/main/java --include="*.kt" -l | head -5 || true)
          if [ -n "$SETTINGS" ]; then
            echo "- **Enhanced Settings Experience:** Add settings search, categories, and quick toggles" >> feature_report.md
          fi
          
          # Check for theming
          THEMES=$(grep -rn "Theme\|Dark\|Light" app/src/main/java --include="*.kt" -l | head -3 || true)
          if [ -n "$THEMES" ]; then
            echo "- **Custom Themes:** Allow users to create custom color themes beyond dark/light mode" >> feature_report.md
          fi
          
          # Check for widgets
          WIDGETS=$(grep -rn "AppWidgetProvider\|RemoteViews" app/src/main/java --include="*.kt" -l || true)
          if [ -z "$WIDGETS" ]; then
            echo "- **Home Screen Widget:** Add music player widget for quick playback control" >> feature_report.md
          fi
          
          # Playback features
          echo "" >> feature_report.md
          echo "#### 🎵 Playback Features" >> feature_report.md
          
          # Check for equalizer
          EQUALIZER=$(grep -rn "Equalizer\|AudioEffect" app/src/main/java --include="*.kt" -l || true)
          if [ -z "$EQUALIZER" ]; then
            echo "- **Audio Equalizer:** Add built-in equalizer with presets for different music genres" >> feature_report.md
          fi
          
          # Check for sleep timer
          SLEEP_TIMER=$(grep -rn "SleepTimer\|Timer" app/src/main/java --include="*.kt" | grep -i sleep || true)
          if [ -z "$SLEEP_TIMER" ]; then
            echo "- **Sleep Timer:** Add option to stop playback after specified duration" >> feature_report.md
          fi
          
          # Check for queue management
          QUEUE=$(grep -rn "Queue\|Playlist" app/src/main/java --include="*.kt" -l | head -3 || true)
          if [ -n "$QUEUE" ]; then
            echo "- **Smart Queue:** AI-powered queue suggestions based on listening history" >> feature_report.md
            echo "- **Queue Editing:** Drag and drop queue reordering" >> feature_report.md
          fi
          
          # Check for lyrics features
          echo "" >> feature_report.md
          echo "#### 📜 Lyrics Features" >> feature_report.md
          
          LYRICS=$(grep -rn "Lyrics\|Synced" app/src/main/java --include="*.kt" -l | head -5 || true)
          if [ -n "$LYRICS" ]; then
            echo "- **Karaoke Mode:** Highlight current word in synced lyrics" >> feature_report.md
            echo "- **Lyrics Editor:** Allow users to fix incorrect lyrics" >> feature_report.md
            echo "- **Multi-language Lyrics:** Show original and translated lyrics side by side" >> feature_report.md
          fi
          
          # Network/Streaming features
          echo "" >> feature_report.md
          echo "#### 🌐 Network & Streaming" >> feature_report.md
          
          STREAMING=$(grep -rn "Stream\|Http\|Network" app/src/main/java --include="*.kt" -l | head -5 || true)
          if [ -n "$STREAMING" ]; then
            echo "- **Offline Mode:** Download songs for offline playback" >> feature_report.md
            echo "- **Cast Support:** Chromecast/AirPlay support for streaming to devices" >> feature_report.md
            echo "- **Podcast Support:** Add podcast streaming capability" >> feature_report.md
          fi
          
          # Social features
          echo "" >> feature_report.md
          echo "#### 👥 Social & Sharing" >> feature_report.md
          echo "- **Share Now Playing:** Share current song to social media with album art" >> feature_report.md
          echo "- **Collaborative Playlists:** Allow users to create shared playlists" >> feature_report.md
          echo "- **Listen Together:** Real-time synchronized listening sessions" >> feature_report.md
          
          # Analytics & Smart features
          echo "" >> feature_report.md
          echo "#### 📊 Analytics & Smart Features" >> feature_report.md
          echo "- **Listening Statistics:** Detailed stats on listening habits" >> feature_report.md
          echo "- **Mood-Based Recommendations:** Songs based on detected mood" >> feature_report.md
          echo "- **Auto-Play Similar:** Automatically queue similar songs" >> feature_report.md
          
          # Accessibility
          echo "" >> feature_report.md
          echo "#### ♿ Accessibility" >> feature_report.md
          ACCESSIBILITY=$(grep -rn "Accessibility\|ContentDescription" app/src/main/java --include="*.kt" -l | head -3 || true)
          if [ -z "$ACCESSIBILITY" ]; then
            echo "- **Screen Reader Support:** Enhanced TalkBack/VoiceOver support" >> feature_report.md
          fi
          echo "- **Voice Commands:** Control playback with voice commands" >> feature_report.md
          
          # Performance optimizations
          echo "" >> feature_report.md
          echo "#### ⚡ Performance" >> feature_report.md
          echo "- **Fast Startup:** Optimize cold start time" >> feature_report.md
          echo "- **Battery Saver Mode:** Reduce battery consumption during playback" >> feature_report.md
          echo "- **Low Memory Mode:** Reduce memory usage on older devices" >> feature_report.md
          
          echo "" >> feature_report.md
          echo "---" >> feature_report.md
          echo "*Report generated by Feature Proposer Agent 🤖*" >> feature_report.md

      - name: Create feature proposal issues
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a master feature proposal issue
          gh issue create \
            --title "💡 Feature Proposals - $(date '+%Y-%m-%d')" \
            --body-file feature_report.md \
            --label "enhancement,automated,feature-request" || echo "Issue might already exist"

      - name: Upload feature report
        uses: actions/upload-artifact@v4
        with:
          name: feature-proposals
          path: feature_report.md
          retention-days: 30
