name: Performance Agent
on:
  schedule:
    - cron: '0 13 * * *'  # Daily at 1 PM UTC
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Run benchmark tests'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  performance-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo "KERNEL_EXTRA_MODULES: vfio vfio_iommu_type1 vfio_pci vfio_virqfd"
          echo "KVM acceleration will be used for benchmarks"

      - name: Analyze performance
        id: perf
        run: |
          echo "## ⚡ Performance Agent Report" > perf_report.md
          echo "" >> perf_report.md
          echo "**Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> perf_report.md
          echo "" >> perf_report.md
          
          # Build time analysis
          echo "### 🔨 Build Performance" >> perf_report.md
          echo "" >> perf_report.md
          
          START_TIME=$(date +%s)
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || true
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          
          echo "- **Build time:** ${BUILD_TIME}s" >> perf_report.md
          
          if [ "$BUILD_TIME" -gt 300 ]; then
            echo "⚠️ Build time exceeds 5 minutes. Consider optimization." >> perf_report.md
          else
            echo "✅ Build time is acceptable." >> perf_report.md
          fi
          
          # APK size analysis
          echo "" >> perf_report.md
          echo "### 📦 APK Size Analysis" >> perf_report.md
          echo "" >> perf_report.md
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(stat -c%s "app/build/outputs/apk/debug/app-debug.apk" 2>/dev/null || stat -f%z "app/build/outputs/apk/debug/app-debug.apk" 2>/dev/null || echo "0")
            APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))
            echo "- **APK size:** ${APK_SIZE_MB}MB" >> perf_report.md
            
            if [ "$APK_SIZE_MB" -gt 50 ]; then
              echo "⚠️ APK size exceeds 50MB. Consider reducing resources." >> perf_report.md
            fi
            
            # Analyze APK contents
            unzip -l app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -50 > apk_contents.txt || true
            
            # Find largest files
            echo "" >> perf_report.md
            echo "**Top 10 largest files in APK:**" >> perf_report.md
            echo '```' >> perf_report.md
            sort -k3 -n -r apk_contents.txt | head -10 >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Method count analysis
          echo "" >> perf_report.md
          echo "### 📊 Method Count" >> perf_report.md
          echo "" >> perf_report.md
          
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee assemble.log || true
          
          # Analyze code complexity
          echo "" >> perf_report.md
          echo "### 🧮 Code Complexity Analysis" >> perf_report.md
          echo "" >> perf_report.md
          
          # Count lines of code
          TOTAL_LINES=$(find app/src/main/java -name "*.kt" -o -name "*.java" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          echo "- **Total lines of code:** $TOTAL_LINES" >> perf_report.md
          
          # Find large files
          echo "" >> perf_report.md
          echo "**Files over 500 lines:**" >> perf_report.md
          echo '```' >> perf_report.md
          find app/src/main/java -name "*.kt" -exec wc -l {} \; 2>/dev/null | awk '$1 > 500 {print}' >> perf_report.md
          echo '```' >> perf_report.md
          
          # Find complex functions
          echo "" >> perf_report.md
          echo "### 🔍 Potential Performance Issues" >> perf_report.md
          echo "" >> perf_report.md
          
          # Check for nested loops
          NESTED_LOOPS=$(grep -rn "for.*for\|while.*while" app/src/main/java --include="*.kt" --include="*.java" | head -10 || true)
          if [ -n "$NESTED_LOOPS" ]; then
            echo "⚠️ **Potential nested loops (performance concern):**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$NESTED_LOOPS" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Check for allocations in loops
          ALLOC_IN_LOOPS=$(grep -rn "for.*{\|while.*{" app/src/main/java --include="*.kt" -A 3 | grep "ArrayList\|HashMap\|new " | head -10 || true)
          if [ -n "$ALLOC_IN_LOOPS" ]; then
            echo "" >> perf_report.md
            echo "⚠️ **Potential allocations inside loops:**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$ALLOC_IN_LOOPS" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Check for synchronous network calls on main thread
          SYNC_NETWORK=$(grep -rn "runBlocking\|.await()" app/src/main/java --include="*.kt" | grep -v "test\|Test" | head -10 || true)
          if [ -n "$SYNC_NETWORK" ]; then
            echo "" >> perf_report.md
            echo "⚠️ **Potential synchronous blocking calls:**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$SYNC_NETWORK" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Check Compose recomposition issues
          echo "" >> perf_report.md
          echo "### 🎨 Jetpack Compose Performance" >> perf_report.md
          echo "" >> perf_report.md
          
          # Find @Composable functions without key
          COMPOSE_WITHOUT_KEY=$(grep -rn "@Composable" app/src/main/java --include="*.kt" -A 5 | grep "items(" | grep -v "key\|contentType" | head -10 || true)
          if [ -n "$COMPOSE_WITHOUT_KEY" ]; then
            echo "⚠️ **LazyColumn/LazyRow items without key:**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$COMPOSE_WITHOUT_KEY" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Find mutableStateOf that could cause excessive recomposition
          MUTABLE_STATE=$(grep -rn "mutableStateOf" app/src/main/java --include="*.kt" | wc -l || echo "0")
          echo "- **mutableStateOf usage count:** $MUTABLE_STATE" >> perf_report.md
          
          # Memory leak patterns
          echo "" >> perf_report.md
          echo "### 💾 Memory Leak Patterns" >> perf_report.md
          echo "" >> perf_report.md
          
          # Check for ViewModels holding Activity context
          VM_CONTEXT=$(grep -rn "class.*ViewModel" app/src/main/java --include="*.kt" -A 10 | grep "Activity\|Fragment" | grep -v "NavController\|SavedStateHandle" | head -5 || true)
          if [ -n "$VM_CONTEXT" ]; then
            echo "⚠️ **ViewModel might hold Activity/Fragment reference:**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$VM_CONTEXT" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          # Check for unregistered receivers
          UNREGISTERED=$(grep -rn "registerReceiver" app/src/main/java --include="*.kt" | grep -v "unregisterReceiver" | head -10 || true)
          if [ -n "$UNREGISTERED" ]; then
            echo "" >> perf_report.md
            echo "⚠️ **BroadcastReceiver registered but might not be unregistered:**" >> perf_report.md
            echo '```' >> perf_report.md
            echo "$UNREGISTERED" >> perf_report.md
            echo '```' >> perf_report.md
          fi
          
          echo "" >> perf_report.md
          echo "---" >> perf_report.md
          echo "*Report generated by Performance Agent 🤖*" >> perf_report.md

      - name: Create performance issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(grep -c "⚠️" perf_report.md 2>/dev/null || echo "0")
          if [ "$ISSUES" -gt 2 ]; then
            gh issue create \
              --title "⚡ Performance Optimization Report - $(date '+%Y-%m-%d')" \
              --body-file perf_report.md \
              --label "performance,automated" || echo "Issue might already exist"
          fi

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: perf_report.md
          retention-days: 30
