name: Bug Detector Agent
on:
  schedule:
    - cron: '30 17 * * *'  # Daily at 1:05 PM Caracas (UTC-4)
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope to analyze (all, recent, specific-module)'
        required: false
        default: 'recent'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  detect-bugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Analyze codebase for bugs
        id: analyze
        run: |
          echo "## 🐛 Bug Detector Agent Report" > bug_report.md
          echo "" >> bug_report.md
          echo "**Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> bug_report.md
          echo "" >> bug_report.md
          
          # Run static analysis
          echo "### 🔍 Static Analysis Results" >> bug_report.md
          echo "" >> bug_report.md
          
          # Run lint
          ./gradlew lintDebug 2>&1 | tee lint.log || true
          LINT_ERRORS=$(grep -c "Error:" lint.log 2>/dev/null || echo "0")
          echo "- **Lint errors found:** $LINT_ERRORS" >> bug_report.md
          
          # Run ktlint
          ./gradlew ktlintCheck 2>&1 | tee ktlint.log || true
          KTLINT_ERRORS=$(grep -c ".*" ktlint.log 2>/dev/null || echo "0")
          echo "- **Ktlint violations:** $KTLINT_ERRORS" >> bug_report.md
          
          # Check for common bug patterns
          echo "" >> bug_report.md
          echo "### 🔎 Bug Pattern Detection" >> bug_report.md
          echo "" >> bug_report.md
          
          # Find potential null pointer issues
          echo "#### Null Safety Issues" >> bug_report.md
          NULL_ISSUES=$(grep -rn "!!" app/src/main/java --include="*.kt" | head -20 || true)
          if [ -n "$NULL_ISSUES" ]; then
            echo '```' >> bug_report.md
            echo "$NULL_ISSUES" >> bug_report.md
            echo '```' >> bug_report.md
          else
            echo "No critical null assertions found." >> bug_report.md
          fi
          
          # Find potential memory leaks
          echo "" >> bug_report.md
          echo "#### Potential Memory Leaks" >> bug_report.md
          MEMORY_ISSUES=$(grep -rn "Activity\|Fragment" app/src/main/java --include="*.kt" | grep -i "static\|companion" | head -10 || true)
          if [ -n "$MEMORY_ISSUES" ]; then
            echo '```' >> bug_report.md
            echo "$MEMORY_ISSUES" >> bug_report.md
            echo '```' >> bug_report.md
          else
            echo "No obvious memory leak patterns found." >> bug_report.md
          fi
          
          # Find TODOs that might be bugs
          echo "" >> bug_report.md
          echo "#### Unresolved TODOs" >> bug_report.md
          TODOS=$(grep -rn "TODO\|FIXME\|XXX\|HACK" app/src/main/java --include="*.kt" | head -20 || true)
          if [ -n "$TODOS" ]; then
            echo '```' >> bug_report.md
            echo "$TODOS" >> bug_report.md
            echo '```' >> bug_report.md
          fi
          
          # Check for deprecated API usage
          echo "" >> bug_report.md
          echo "#### Deprecated API Usage" >> bug_report.md
          DEPRECATED=$(grep -rn "@Deprecated\|deprecated" app/src/main/java --include="*.kt" | head -10 || true)
          if [ -n "$DEPRECATED" ]; then
            echo '```' >> bug_report.md
            echo "$DEPRECATED" >> bug_report.md
            echo '```' >> bug_report.md
          fi
          
          # Run unit tests
          echo "" >> bug_report.md
          echo "### 🧪 Test Results" >> bug_report.md
          ./gradlew testDebugUnitTest 2>&1 | tee test.log || true
          if grep -q "BUILD SUCCESSFUL" test.log; then
            echo "- ✅ All tests passed" >> bug_report.md
          else
            echo "- ❌ Some tests failed" >> bug_report.md
            echo '```' >> bug_report.md
            tail -30 test.log >> bug_report.md
            echo '```' >> bug_report.md
          fi
          
          echo "" >> bug_report.md
          echo "---" >> bug_report.md
          echo "*Report generated by Bug Detector Agent 🤖*" >> bug_report.md

      - name: Create bug issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create issue if lint errors found
          LINT_COUNT=$(grep -c "Lint errors found:" bug_report.md 2>/dev/null || echo "0")
          if [ "$LINT_COUNT" -gt 0 ]; then
            gh issue create \
              --title "🐛 Weekly Bug Report - $(date '+%Y-%m-%d')" \
              --body-file bug_report.md \
              --label "bug,automated,weekly-scan" || echo "Issue might already exist"
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bug-detector-report
          path: bug_report.md
          retention-days: 30
