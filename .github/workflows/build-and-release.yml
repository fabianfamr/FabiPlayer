name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Título personalizado del release (opcional)'
        required: false
        type: string
      release_notes:
        description: 'Descripción personalizada del release (opcional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Version
        id: get_version
        run: |
          if [ -f "VERSION" ]; then
            VNAME=$(sed -n '1p' VERSION | tr -d '\r\n[:space:]')
            VCODE=$(sed -n '2p' VERSION | tr -d '\r\n[:space:]')
          elif [ -f "gradle.properties" ] && grep -q '^APP_VERSION_NAME=' gradle.properties; then
            VNAME=$(grep '^APP_VERSION_NAME=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r\n[:space:]')
            VCODE=$(grep '^APP_VERSION_CODE=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r\n[:space:]')
          else
            VNAME=$(grep -E '^\s*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            VCODE=$(grep -E '^\s*versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          fi
          echo "VERSION_NAME=$VNAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VCODE" >> $GITHUB_OUTPUT
          echo "VERSION=$VNAME" >> $GITHUB_OUTPUT

      - name: Resolve Release Metadata
        id: release_meta
        env:
          INPUT_TITLE: ${{ inputs.release_title }}
          INPUT_BODY: ${{ inputs.release_notes }}
          VERSION_NAME: ${{ steps.get_version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.get_version.outputs.VERSION_CODE }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - << 'PY'
          import os
          import re
          import subprocess

          def git_output(args):
              res = subprocess.run(["git", *args], capture_output=True, text=True)
              return res.stdout.strip() if res.returncode == 0 else ""

          version_name = os.environ.get("VERSION_NAME", "").strip()
          version_code = os.environ.get("VERSION_CODE", "").strip()
          ref_name = os.environ.get("REF_NAME", "").strip()
          is_tag = os.environ.get("IS_TAG", "").lower() == "true"
          commit_sha = os.environ.get("COMMIT_SHA", "").strip()

          input_title = os.environ.get("INPUT_TITLE", "").strip()
          input_body = os.environ.get("INPUT_BODY", "").strip()

          tag_subject = ""
          tag_body = ""
          if is_tag and ref_name:
              obj_type = git_output(["cat-file", "-t", f"refs/tags/{ref_name}"])
              if obj_type == "tag":
                  tag_subject = git_output(["for-each-ref", "--format=%(contents:subject)", f"refs/tags/{ref_name}"])
                  tag_body = git_output(["for-each-ref", "--format=%(contents:body)", f"refs/tags/{ref_name}"])

          commit_subject = git_output(["log", "-1", "--pretty=%s"])
          commit_body = git_output(["log", "-1", "--pretty=%b"])

          changelog_body = ""
          if os.path.isfile("CHANGELOG.md") and version_name:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  changelog_text = f.read()
              pattern = re.compile(
                  rf"^##\s+\[?v?{re.escape(version_name)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(changelog_text)
              if match:
                  changelog_body = match.group(1).strip()

          release_title = (
              input_title
              or tag_subject
              or commit_subject
              or (f"v{version_name}" if version_name else "FabiPlayer Release")
          )
          release_title = " ".join(release_title.splitlines()).strip()

          release_body = input_body or tag_body or commit_body or changelog_body
          if not release_body:
              lines = []
              if commit_subject:
                  lines.append(commit_subject)
              if version_name:
                  lines.append(f"Versión: {version_name}" + (f" ({version_code})" if version_code else ""))
              if commit_sha:
                  lines.append(f"Commit: `{commit_sha[:7]}`")
              release_body = "\n".join(lines)

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(release_body + "\n")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"RELEASE_TITLE={release_title}\n")
          PY

      - name: Configure Release Signing
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_STORE_PASSWORD: ${{ secrets.CI_STORE_PASSWORD }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          mkdir -p app
          KEYSTORE_B64="${CI_KEYSTORE_BASE64:-$CI_KEYSTORE_B64}"
          STORE_PASS="${CI_STORE_PASSWORD:-${CI_KEYSTORE_PASSWORD:-android}}"
          ALIAS_NAME="${CI_KEY_ALIAS:-androiddebugkey}"
          KEY_PASS="${CI_KEY_PASSWORD:-$STORE_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restaurando keystore desde secreto de CI..."
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > app/keystore.jks
          elif [ -f "release.keystore" ]; then
            cp release.keystore app/keystore.jks
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '\n\r' < debug.keystore.base64 | base64 -d > app/keystore.jks
          elif [ -f "debug.keystore" ]; then
            cp debug.keystore app/keystore.jks
          else
            echo "No release keystore found, generating a temporary keystore..."
            keytool -genkey -v -keystore app/keystore.jks -storepass "$STORE_PASS" -alias "$ALIAS_NAME" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FabiPlayer CI,O=FabiPlayer,C=US"
          fi

          {
            echo "storeFile=app/keystore.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS_NAME"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Build Release APK
        run: >
          ./gradlew :app:assembleRelease
          -Ppixelplayer.enableAbiSplits=false
          -PAPP_VERSION_NAME=${{ steps.get_version.outputs.VERSION_NAME }}
          -PAPP_VERSION_CODE=${{ steps.get_version.outputs.VERSION_CODE }}

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release_assets
          VNAME="${{ steps.get_version.outputs.VERSION_NAME }}"

          if [ -f "app/build/outputs/apk/release/app-universal-release.apk" ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk "release_assets/FabiPlayer-v${VNAME}-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/FabiPlayer-v${VNAME}-release.apk"
          fi

          ls -lh release_assets

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabiplayer-release
          path: release_assets/*release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.get_version.outputs.VERSION_NAME) }}
          name: ${{ steps.release_meta.outputs.RELEASE_TITLE }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
