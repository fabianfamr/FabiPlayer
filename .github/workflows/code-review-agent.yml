name: Code Review Agent
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Analyze PR changes
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          # Get PR details
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER)
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_BODY=$(echo "$PR_DATA" | jq -r '.body')
          PR_FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate)
          
          # Get diff
          DIFF=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.diff_url' | xargs curl -sL)
          
          # Analyze code quality
          echo "## 🔍 Code Review Agent Analysis" > review.md
          echo "" >> review.md
          echo "### PR: $PR_TITLE" >> review.md
          echo "" >> review.md
          
          # Check for common issues
          echo "#### 📋 Code Quality Checks" >> review.md
          echo "" >> review.md
          
          # Count changed files
          CHANGED_FILES=$(echo "$PR_FILES" | jq 'length')
          echo "- **Changed files:** $CHANGED_FILES" >> review.md
          
          # Check for large files
          LARGE_FILES=$(echo "$PR_FILES" | jq -r '.[] | select(.changes > 500) | .filename')
          if [ -n "$LARGE_FILES" ]; then
            echo "- ⚠️ **Large file changes detected:**" >> review.md
            echo "$LARGE_FILES" | while read file; do
              echo "  - $file" >> review.md
            done
          fi
          
          # Run ktlint
          echo "" >> review.md
          echo "#### 🎨 Kotlin Style Analysis" >> review.md
          ./gradlew ktlintCheck 2>/dev/null || true
          
          # Build check
          echo "" >> review.md
          echo "#### 🔨 Build Status" >> review.md
          if ./gradlew compileDebugKotlin 2>&1 | tee build.log; then
            echo "- ✅ Build successful" >> review.md
          else
            echo "- ❌ Build failed" >> review.md
            echo '```' >> review.md
            tail -50 build.log >> review.md
            echo '```' >> review.md
          fi
          
          # Generate improvement suggestions
          echo "" >> review.md
          echo "#### 💡 Improvement Suggestions" >> review.md
          echo "" >> review.md
          
          # Analyze Kotlin files for patterns
          KOTLIN_FILES=$(echo "$PR_FILES" | jq -r '.[] | select(.filename | endswith(".kt") or endswith(".kts")) | .filename')
          
          for file in $KOTLIN_FILES; do
            if [ -f "$file" ]; then
              # Check for TODO comments
              TODOS=$(grep -c "TODO\|FIXME" "$file" 2>/dev/null || echo "0")
              if [ "$TODOS" -gt 0 ]; then
                echo "- 📝 **$file:** Contains $TODOS TODO/FIXME comments" >> review.md
              fi
              
              # Check for long functions
              LONG_FUNCS=$(grep -c "fun .* {" "$file" 2>/dev/null || echo "0")
              if [ "$LONG_FUNCS" -gt 5 ]; then
                echo "- 📏 **$file:** Consider breaking down functions" >> review.md
              fi
            fi
          done
          
          echo "" >> review.md
          echo "---" >> review.md
          echo "*Review generated by Code Review Agent 🤖*" >> review.md

      - name: Post review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          gh pr comment $PR_NUMBER --body-file review.md

      - name: Create improvement issue if needed
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          
          # If build failed, create an issue
          if grep -q "Build failed" review.md; then
            gh issue create \
              --title "🔧 Build Fix Required for PR #$PR_NUMBER" \
              --body "The Code Review Agent detected build failures in PR #$PR_NUMBER. Please review and fix the issues before merging." \
              --label "bug,automated" \
              --assignee "${{ github.actor }}"
          fi
